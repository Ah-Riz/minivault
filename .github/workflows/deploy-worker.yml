name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Must match the account that owns worker "minivault" (not from a mismatched secret).
      CLOUDFLARE_ACCOUNT_ID: "9566706794f5e710b31e54379c39f104"
      NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_PROGRAM_ID: Eg1fXRg5AQ2P9834Lr2mTkjr9Zy5dMG6HGiqLLJmfoRd
      NEXT_PUBLIC_MINT: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify Cloudflare token can see this account
        run: |
          code=$(curl -sS -o /tmp/cf.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services")
          echo "HTTP $code"
          head -c 500 /tmp/cf.json; echo
          test "$code" = "200"

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
